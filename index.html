<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Suinga — ouça onde quiser.">
    <meta name="theme-color" content="#131112">
    <title>Suinga — Ouça onde quiser</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="site-shell">
      <section class="hero" aria-label="Suinga">
        <div id="suingaCarousel" class="carousel slide carousel-fade hero-carousel" data-bs-ride="carousel" data-bs-interval="6000" data-bs-pause="hover">
          <div class="carousel-indicators" role="group" aria-label="Selecionar foto da galeria">
            <button type="button" data-bs-target="#suingaCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Exibir foto 1"></button>
            <button type="button" data-bs-target="#suingaCarousel" data-bs-slide-to="1" aria-label="Exibir foto 2"></button>
            <button type="button" data-bs-target="#suingaCarousel" data-bs-slide-to="2" aria-label="Exibir foto 3"></button>
            <button type="button" data-bs-target="#suingaCarousel" data-bs-slide-to="3" aria-label="Exibir foto 4"></button>
            <button type="button" data-bs-target="#suingaCarousel" data-bs-slide-to="4" aria-label="Exibir foto 5"></button>
            <button type="button" data-bs-target="#suingaCarousel" data-bs-slide-to="5" aria-label="Exibir foto 6"></button>
            <button type="button" data-bs-target="#suingaCarousel" data-bs-slide-to="6" aria-label="Exibir foto 7"></button>
            <button type="button" data-bs-target="#suingaCarousel" data-bs-slide-to="7" aria-label="Exibir foto 8"></button>
          </div>
          <div class="carousel-inner h-100">
            <div class="carousel-item active h-100"><img src="assets/images/slide-01.webp" class="d-block w-100 hero-image" alt="Integrantes da Suinga" fetchpriority="high"></div>
            <div class="carousel-item h-100"><img src="assets/images/slide-02.webp" class="d-block w-100 hero-image" alt="Suinga em apresentação" loading="lazy"></div>
            <div class="carousel-item h-100"><img src="assets/images/slide-03.webp" class="d-block w-100 hero-image" alt="Banda Suinga" loading="lazy"></div>
            <div class="carousel-item h-100"><img src="assets/images/slide-04.webp" class="d-block w-100 hero-image" alt="Show da Suinga" loading="lazy"></div>
            <div class="carousel-item h-100"><img src="assets/images/slide-05.webp" class="d-block w-100 hero-image" alt="Performance da Suinga" loading="lazy"></div>
            <div class="carousel-item h-100"><img src="assets/images/slide-06.webp" class="d-block w-100 hero-image" alt="Suinga no palco" loading="lazy"></div>
            <div class="carousel-item h-100"><img src="assets/images/slide-07.webp" class="d-block w-100 hero-image" alt="Música e energia com Suinga" loading="lazy"></div>
            <div class="carousel-item h-100"><img src="assets/images/slide-08.webp" class="d-block w-100 hero-image" alt="Suinga em apresentação" loading="lazy"></div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#suingaCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Foto anterior</span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#suingaCarousel" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Próxima foto</span></button>
        </div>

        <div class="hero-overlay"></div>
        <div class="hero-content container text-center">
          <img class="brand-logo" src="assets/images/logo-suinga.webp" alt="Suinga" width="1200" height="530">
          <p class="eyebrow">A trilha da sua energia</p>
          <h1>Ouça Suinga onde quiser.</h1>
          <p class="hero-copy">Escolha sua plataforma preferida e dê o play.</p>

          <nav class="platforms" aria-label="Ouça Suinga nas plataformas digitais">
            <!-- Substitua os links abaixo pelos perfis oficiais da Suinga antes de publicar. -->
            <a class="platform-link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="Ouvir Suinga no YouTube" title="YouTube"><i class="bi bi-youtube" aria-hidden="true"></i><span>YouTube</span></a>
            <a class="platform-link" href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" aria-label="Ouvir Suinga no Spotify" title="Spotify"><i class="bi bi-spotify" aria-hidden="true"></i><span>Spotify</span></a>
            <a class="platform-link" href="https://www.deezer.com/" target="_blank" rel="noopener noreferrer" aria-label="Ouvir Suinga no Deezer" title="Deezer"><i class="bi bi-soundwave" aria-hidden="true"></i><span>Deezer</span></a>
            <a class="platform-link" href="https://music.apple.com/" target="_blank" rel="noopener noreferrer" aria-label="Ouvir Suinga no Apple Music" title="Apple Music"><i class="bi bi-apple" aria-hidden="true"></i><span>Apple Music</span></a>
            <a class="platform-link" href="https://music.amazon.com/" target="_blank" rel="noopener noreferrer" aria-label="Ouvir Suinga no Amazon Music" title="Amazon Music"><i class="bi bi-amazon" aria-hidden="true"></i><span>Amazon Music</span></a>
            <a class="platform-link" href="https://music.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="Ouvir Suinga no YouTube Music" title="YouTube Music"><i class="bi bi-play-circle-fill" aria-hidden="true"></i><span>YouTube Music</span></a>
          </nav>
        </div>

        <footer class="site-footer">© <span id="currentYear">2026</span> Suinga. Todos os direitos reservados.</footer>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
